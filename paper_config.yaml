# paper_config.yaml — METF + Band Condor paper-mode signal logger (see paper_engine.py)
# One fixed config for the test window. No parameter sweeps until 100 entries/strategy.

timezone: America/New_York
account_equity: 100000          # for daily risk budget calc only
daily_risk_pct: 0.03            # 3% — sum of ALL strategies' stop losses; raised
                                # from 1.5% when MEIC + ORB joined the experiment
skip_dates: []                  # FOMC minutes, CPI — YYYY-MM-DD (FOMC decision days
                                # are added automatically from trade_builder.FOMC_2026)

metf:
  enabled: true
  slots: ["10:00", "10:45", "11:30", "12:30", "13:30", "14:15"]
  ema_fast: 20
  ema_slow: 40
  ema_bar: "1min"
  width: 30                     # points
  target_credit: 1.50           # per spread, mid
  min_credit: 1.25              # skip slot if best available mid < this
  stop_multiple: 1.0            # stop when spread value >= credit * (1 + stop_multiple)
  hold_to_expiry: true
  contracts: 1

band:
  enabled: true
  band_time: "10:30"
  entry_time: "10:35"
  em_factor: 0.85               # expected move = straddle_mid * em_factor
  wing_width: 30
  skew_lo: 0.80                 # inside [lo, hi] -> full condor; outside -> single vertical on cushioned side
  skew_hi: 1.25
  stop_rule: "total_credit_per_side"
  take_profit_short: 0.05
  containment_window: 20        # rolling days
  size_full_above: 0.70
  size_half_above: 0.55
  contracts: 1

execution:
  mode: simulated               # simulated = engine fills its own orders into
                                # the *_actual columns (paperMoney has no API);
                                # set to "off" to type fills in manually
  entry_slippage: 0.05          # credit received = theo credit - this
  exit_slippage: 0.05           # stop/TP exit paid = theo exit + this

meic:                             # Multiple Entry Iron Condor (afternoon)
  enabled: true
  slots: ["12:00", "12:30", "13:00", "13:30", "14:00", "14:30"]
  side_credit: 1.50               # per-side credit target (walked like METF)
  min_side_credit: 1.25
  wing_width: 30
  take_profit_short: 0.05
  contracts: 1

orb:                              # Opening Range Breakout — directional DEBIT
  enabled: true
  range_end: "10:00"              # opening range = 09:30 to here
  check_slots: ["10:30", "11:30", "13:00"]
  width: 30
  stop_loss_frac: 0.50            # stop when the vertical loses half its debit
  contracts: 1
