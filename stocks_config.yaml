# stocks_config.yaml — Stocks & ETF sandbox (see STOCKS_SPEC.md)
# One fixed config for the test window. Mirrors stocks_engine.DEFAULTS.
# Changing a strategy rule after its first trade = a NEW strategy (spec §0).

account_equity: 100000
risk_per_trade_pct: 0.005        # $500 per campaign = qty x stop distance
max_notional_pct: 0.08           # per-campaign notional cap
heat_cap_pct: 0.08               # sum of open stop risk
daily_new_risk_pct: 0.02         # sum of today's entries + adds initial risk

slippage_bps: {large: 5, etf: 2}
sell_fee_bps: 0.278              # SEC fee on sell notional
taf_per_share: 0.000166          # FINRA TAF on sells (capped per trade)
taf_cap: 8.30

universe:
  stocks: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, JPM, V, MA, UNH,
           XOM, LLY, JNJ, PG, HD, COST, ABBV, MRK, PEP, KO, WMT, BAC, CVX,
           ORCL, CRM, AMD, NFLX, ADBE, TMO, LIN, ACN, MCD, CSCO, ABT, WFC,
           DHR, TXN, QCOM, INTU, CAT, GE, AMAT, IBM, NOW, ISRG, UBER, BKNG,
           GS, SPGI, PLTR, PANW, MU, LRCX, KLAC, ANET, CRWD, DE, LMT, RTX,
           HON, UNP, SBUX, NKE, TJX, MDT, BLK, AXP, MS, C, SCHW, VRTX, REGN,
           ADP, CMG, TMUS, COP, PGR, ETN]
  etfs: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLB,
         XLRE, XLC, SMH, GLD, TLT, EEM, EFA]

# stage: backtest -> paper -> retired (STOCKS_SPEC.md §9). The paper engine
# trades ONLY strategies at `stage: paper`; a strategy gets there by passing
# the backtest gate below (stocks_backtest.py) and the owner promoting it.
# Backtest verdicts 2026-09-30 (10y Yahoo history, params as below):
#   MOM  PASS (PF 2.32, OOS PF 2.8, Sharpe 1.02 vs 1.00 universe hold) -> paper
#   PB90 FAIL (PF 1.16, Sharpe 0.51 vs 1.00)                           -> backtest
#   RSI2 FAIL (PF 1.27, Sharpe 0.51 vs 0.75)                           -> backtest

mom:
  enabled: true
  stage: paper
  expl_rank_min: 90
  max_new_per_day: 2
  max_open: 8
  ph1_stop: 0.85                 # exit at entry x 0.85
  ph2_trail: 0.85                # exit at peak x 0.85 once added-to
  add_r21_min: 10.0              # double-down: 1M >= +10%
  add_within_peak: 0.03          #              within 3% of peak close
  review_days: 28                # going-nowhere review...
  review_band: 5.0               # ...when return is within +/- 5%

pb90:
  enabled: true
  stage: backtest
  expl_rank_min: 75
  r1y_rank_min: 70
  pb_lo: 2.0                     # % below the 63-session high
  pb_hi: 12.0
  atr_stop: 2.0
  time_stop_sessions: 20
  max_new_per_day: 2
  max_open: 5

rsi2:
  enabled: true
  stage: backtest
  rsi_max: 10.0
  atr_stop: 3.0
  exit_sma: 5
  time_stop_sessions: 10
  max_new_per_day: 2
  max_open: 4

# ── candidates added 2026-09-30 (owner: "strong edge, survives, high octane")
# All start at stage: backtest. Rules fixed here BEFORE their first backtest.
momr:                            # MOM + regime filter (SPY > SMA200, breadth >= 50%)
  enabled: true
  stage: backtest
  expl_rank_min: 90
  max_new_per_day: 2
  max_open: 8
  ph1_stop: 0.85
  ph2_trail: 0.85
  add_r21_min: 10.0
  add_within_peak: 0.03
  review_days: 28
  review_band: 5.0

brk55:                           # Turtle: 55-day closing high > SMA200; exit 20-day low
  enabled: true
  stage: backtest
  atr_stop: 2.0
  max_new_per_day: 2
  max_open: 8

hi52:                            # 52-week-high momentum (George & Hwang); exit < SMA50
  enabled: true
  stage: backtest
  near_high_pct: 2.0
  expl_rank_min: 80
  stop_pct: 12.0
  max_new_per_day: 2
  max_open: 8

qbo:                             # Qullamaggie-style box breakout; exit close < SMA10
  enabled: true
  stage: backtest
  r63_rank_min: 90
  r63_min: 25.0                  # >= +25% in 3 months (the "octane")
  box_max_pct: 10.0              # prior 10 closes within a 10% range
  atr_stop: 1.5
  time_stop_sessions: 40
  max_new_per_day: 2
  max_open: 6

secrot:                          # monthly dual-momentum ETF rotation, top 3
  enabled: true
  stage: backtest
  top_n: 3
  entry_sessions: 3              # buys only in a month's first 3 sessions
  stop_pct: 15.0                 # catastrophe stop
  max_new_per_day: 3
  max_open: 3

# Backtest -> paper promotion bar (fixed BEFORE the first backtest ran)
backtest_gate:
  min_trades: 50
  min_pf: 1.3
  min_confidence: 0.90          # t-CDF that expectancy > 0
  oos_min_pf: 1.1               # last 30% of the window, held out
  max_dd_pct: 0.15
  beat_benchmark_sharpe: true   # vs equal-weight hold of the SAME universe

# Paper -> live-pilot gates
gates:
  MOM:  {trades: 60,  weeks: 16, tripwire: -3000}
  PB90: {trades: 100, weeks: 12, tripwire: -3000}
  RSI2: {trades: 100, weeks: 10, tripwire: -2500}
  MOMR: {trades: 60,  weeks: 16, tripwire: -3000}
  BRK55: {trades: 80, weeks: 16, tripwire: -3000}
  HI52: {trades: 80,  weeks: 16, tripwire: -3000}
  QBO:  {trades: 80,  weeks: 16, tripwire: -3000}
  SECROT: {trades: 30, weeks: 26, tripwire: -3000}
