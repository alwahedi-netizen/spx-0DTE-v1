# stocks_config.yaml — Stocks & ETF sandbox (see STOCKS_SPEC.md)
# One fixed config for the test window. Mirrors stocks_engine.DEFAULTS.
# Changing a strategy rule after its first trade = a NEW strategy (spec §0).

account_equity: 100000
risk_per_trade_pct: 0.005        # $500 per campaign = qty x stop distance
max_notional_pct: 0.08           # per-campaign notional cap
heat_cap_pct: 0.08               # sum of open stop risk
daily_new_risk_pct: 0.02         # sum of today's entries + adds initial risk

slippage_bps: {large: 5, etf: 2}
sell_fee_bps: 0.278              # SEC fee on sell notional
taf_per_share: 0.000166          # FINRA TAF on sells (capped per trade)
taf_cap: 8.30

universe:
  stocks: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, JPM, V, MA, UNH,
           XOM, LLY, JNJ, PG, HD, COST, ABBV, MRK, PEP, KO, WMT, BAC, CVX,
           ORCL, CRM, AMD, NFLX, ADBE, TMO, LIN, ACN, MCD, CSCO, ABT, WFC,
           DHR, TXN, QCOM, INTU, CAT, GE, AMAT, IBM, NOW, ISRG, UBER, BKNG,
           GS, SPGI, PLTR, PANW, MU, LRCX, KLAC, ANET, CRWD, DE, LMT, RTX,
           HON, UNP, SBUX, NKE, TJX, MDT, BLK, AXP, MS, C, SCHW, VRTX, REGN,
           ADP, CMG, TMUS, COP, PGR, ETN]
  etfs: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLB,
         XLRE, XLC, SMH, GLD, TLT, EEM, EFA]

# stage: backtest -> paper -> retired (STOCKS_SPEC.md §9). The paper engine
# trades ONLY strategies at `stage: paper`; a strategy gets there by passing
# the backtest gate below (stocks_backtest.py) and the owner promoting it.
# Backtest verdicts 2026-09-30 (10y Yahoo history, params as below):
#   MOM  PASS (PF 2.32, OOS PF 2.8, Sharpe 1.02 vs 1.00 universe hold) -> paper,
#        then FAIL on the deep test (STOCKS_SPEC §11) -> back to backtest
#   PB90 FAIL (PF 1.16, Sharpe 0.51 vs 1.00)                           -> backtest
#   RSI2 FAIL (PF 1.27, Sharpe 0.51 vs 0.75)                           -> backtest

mom:
  enabled: true
  stage: backtest                # owner 2026-09-30: stopped — FAILS the deep
                                 # (point-in-time S&P 500) test: PF 1.30, DD -19%
  expl_rank_min: 90
  max_new_per_day: 2
  max_open: 8
  ph1_stop: 0.85                 # exit at entry x 0.85
  ph2_trail: 0.85                # exit at peak x 0.85 once added-to
  add_r21_min: 10.0              # double-down: 1M >= +10%
  add_within_peak: 0.03          #              within 3% of peak close
  review_days: 28                # going-nowhere review...
  review_band: 5.0               # ...when return is within +/- 5%

pb90:
  enabled: true
  stage: backtest
  expl_rank_min: 75
  r1y_rank_min: 70
  pb_lo: 2.0                     # % below the 63-session high
  pb_hi: 12.0
  atr_stop: 2.0
  time_stop_sessions: 20
  max_new_per_day: 2
  max_open: 5

rsi2:
  enabled: true
  stage: backtest
  rsi_max: 10.0
  atr_stop: 3.0
  exit_sma: 5
  time_stop_sessions: 10
  max_new_per_day: 2
  max_open: 4

# ── candidates added 2026-09-30 (owner: "strong edge, survives, high octane")
# All start at stage: backtest. Rules fixed here BEFORE their first backtest.
momr:                            # MOM + regime filter (SPY > SMA200, breadth >= 50%)
  enabled: true
  stage: backtest
  expl_rank_min: 90
  max_new_per_day: 2
  max_open: 8
  ph1_stop: 0.85
  ph2_trail: 0.85
  add_r21_min: 10.0
  add_within_peak: 0.03
  review_days: 28
  review_band: 5.0

brk55:                           # Turtle: 55-day closing high > SMA200; exit 20-day low
  enabled: true
  stage: backtest
  atr_stop: 2.0
  max_new_per_day: 2
  max_open: 8

hi52:                            # 52-week-high momentum (George & Hwang); exit < SMA50
  enabled: true
  stage: backtest
  near_high_pct: 2.0
  expl_rank_min: 80
  stop_pct: 12.0
  max_new_per_day: 2
  max_open: 8

qbo:                             # Qullamaggie-style box breakout; exit close < SMA10
  enabled: true
  stage: backtest
  r63_rank_min: 90
  r63_min: 25.0                  # >= +25% in 3 months (the "octane")
  box_max_pct: 10.0              # prior 10 closes within a 10% range
  atr_stop: 1.5
  time_stop_sessions: 40
  max_new_per_day: 2
  max_open: 6

secrot:                          # monthly dual-momentum ETF rotation, top 3
  enabled: true
  stage: backtest
  top_n: 3
  entry_sessions: 3              # buys only in a month's first 3 sessions
  stop_pct: 15.0                 # catastrophe stop
  max_new_per_day: 3
  max_open: 3

# ── round 3 (2026-09-30): the evidence-backed families, judged on the DEEP
# (point-in-time S&P 500) test. Rules fixed here before their first run.
# Rotation lanes: equal-weight portfolios of top_n names, entries in a
# month's first entry_sessions, exits at the month's first close when a name
# falls below hold_rank (buffer cuts turnover), catastrophe stop_pct.
lowvol:                          # low-volatility anomaly: 15 calmest (1y vol)
  enabled: true
  stage: backtest
  top_n: 15
  hold_rank: 25
  entry_sessions: 3
  stop_pct: 30.0
  max_new_per_day: 15
  max_open: 15

mom12:                           # 12-1 momentum, 15 names, cash when SPY < SMA200
  enabled: true
  stage: backtest
  top_n: 15
  hold_rank: 25
  entry_sessions: 3
  stop_pct: 30.0
  regime: spy200
  max_new_per_day: 15
  max_open: 15

lvmom:                           # momentum + low-vol blended rank, 15 names
  enabled: true
  stage: backtest
  top_n: 15
  hold_rank: 25
  entry_sessions: 3
  stop_pct: 30.0
  max_new_per_day: 15
  max_open: 15

rsi2s:                           # Connors RSI(2) < 5 dip-buy on S&P 500 stocks > SMA200
  enabled: true
  stage: backtest
  rsi_max: 5.0
  atr_stop: 3.0
  exit_sma: 5
  time_stop_sessions: 10
  max_new_per_day: 3
  max_open: 8

etftrend:                        # each of the 20 ETFs held while above SMA200 (monthly)
  enabled: true
  stage: backtest
  top_n: 20
  hold_rank: 20
  entry_sessions: 3
  stop_pct: 25.0
  max_new_per_day: 20
  max_open: 20

# ── round 4 (2026-09-30): market-wide effects on the 4 index ETFs (no
# stock-survivorship issue), judged with dividends. Fixed before first run.
tom:                             # turn of the month (Ariel 1987; Lakonishok & Smidt)
  enabled: true
  stage: backtest
  symbols: [SPY, QQQ, IWM, DIA]
  exit_som: 3                    # sell at the close of the new month's 3rd session
  atr_stop: 3.0
  max_new_per_day: 4
  max_open: 4

ibs:                             # internal bar strength < 0.2 in an uptrend
  enabled: true
  stage: backtest
  symbols: [SPY, QQQ, IWM, DIA]
  ibs_max: 0.2
  atr_stop: 3.0
  time_stop_sessions: 5          # exit: close > prior day's high, or 5 sessions
  max_new_per_day: 4
  max_open: 4

# ── round 5 (owner 2026-09-30): backtest-only STACK book — the four
# low-exposure ETF edges that failed ONLY on Sharpe, run together on one
# account. Chosen after seeing results (selection bias: the held-out
# window and paper are the guard). Judged with dividends + T-bill cash.
stack:
  components: [TOM, SECROT, RSI2, IBS]

# ── round 6 (owner chose "keep searching", 2026-09-30): lanes built to
# raise Sharpe, not just cut losses. Weighted, monthly: sold at the month's
# last close, re-bought at the next open. Fixed before their first run.
vtspy:                           # volatility-managed SPY (Moreira & Muir 2017)
  enabled: true
  stage: backtest
  symbols: [SPY]
  weighting: vol_target
  target_vol: 15.0               # weight = min(1, 15% / realized 21-day vol)
  entry_sessions: 1
  stop_pct: 30.0
  max_new_per_day: 1
  max_open: 1

vt4:                             # the same across the four index ETFs
  enabled: true
  stage: backtest
  symbols: [SPY, QQQ, IWM, DIA]
  weighting: vol_target
  target_vol: 15.0
  entry_sessions: 1
  stop_pct: 30.0
  max_new_per_day: 4
  max_open: 4

rpar:                            # risk parity: stocks / bonds / gold, inverse 63d vol
  enabled: true
  stage: backtest
  symbols: [SPY, TLT, GLD]
  weighting: inverse_vol
  entry_sessions: 1
  stop_pct: 30.0
  max_new_per_day: 3
  max_open: 3

rptrend:                         # risk parity on 5 assets, only those > SMA200
  enabled: true
  stage: backtest
  symbols: [SPY, EFA, EEM, TLT, GLD]
  weighting: inverse_vol
  trend_filter: true             # a filtered asset's weight sits in T-bills
  entry_sessions: 1
  stop_pct: 30.0
  max_new_per_day: 5
  max_open: 5

# ── round 7 (owner: keep searching, stricter bar — 2026-10-01). strict:
# true applies backtest_gate_strict (99% confidence) PLUS "beats buy-and-hold
# in the held-out last 30%". Fixed before their first run.
tsmom:                           # time-series momentum (Moskowitz, Ooi & Pedersen 2012)
  enabled: true
  stage: backtest
  strict: true
  symbols: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLI, XLY, XLP, XLU, XLB,
            XLRE, XLC, SMH, GLD, TLT, EEM, EFA]
  weighting: tsmom               # long while 12m return > 0; 1/N x min(1, 15%/vol63)
  target_vol: 15.0
  entry_sessions: 1
  stop_pct: 30.0
  max_new_per_day: 20
  max_open: 20

gapfade:                         # buy a >= 0.75% gap-down open in an uptrend, sell at the close
  enabled: true
  stage: backtest
  strict: true
  symbols: [SPY, QQQ, IWM, DIA]
  gap_pct: 0.75
  atr_stop: 2.0
  max_new_per_day: 4
  max_open: 4

ovn:                             # overnight: buy at the close, sell at the next open
  enabled: true                  # (backtest-only: the paper engine has no MOC slot yet)
  stage: backtest
  strict: true
  symbols: [SPY, QQQ]
  invested: 0.98

# ── round 8 (owner 2026-10-01: "check Chinese, Indian, Japanese strategies").
# Each method twice: X on the US index ETFs, XA on the Asia ETFs (China
# FXI/MCHI/ASHR, India INDA/EPI, Japan EWJ/DXJ). Strict bar. Fixed before
# their first run. Stops: 3x ATR for all.
#   ICHI  Ichimoku: close > cloud, tenkan > kijun, chikou up; exit < kijun   (Japan)
#   HA    Heikin-Ashi turns bullish after 2 bearish, > SMA200; exit bearish  (Japan)
#   ENG   bullish engulfing at a 10-day low, > SMA200; exit > prior high/5d  (Japan, Homma)
#   KDJ   KDJ(9,3,3) J < 0 while > SMA60; exit J > 100 or 10 sessions        (China)
#   MAAL  MA5>MA10>MA20>MA60 newly aligned; exit close < MA20                (China)
#   ST    Supertrend(10,3) flips up; exit when it flips down                  (India)
ichi:
  enabled: true
  stage: backtest
  strict: true
  symbols: [SPY, QQQ, IWM, DIA]
  atr_stop: 3.0
  max_new_per_day: 4
  max_open: 4
ichia:
