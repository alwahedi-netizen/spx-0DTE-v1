<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox — planned</title>
<style>
  :root { --bg:#f6f4ef; --card:#ffffff; --ink:#1e232b; --mut:#6b7280;
          --line:#e5e1d8; --green:#1a7f4b; --red:#b3372f; --amber:#a8700a;
          --blue:#2b5d8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  header { display:flex; flex-wrap:wrap; align-items:baseline; gap:12px;
           padding:6px 2px 14px; }
  h1 { font-size:20px; margin:0; letter-spacing:.4px; }
  .sub { color:var(--mut); font-size:12px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px;
           font-size:12px; font-weight:600; border:1px solid var(--line); }
  .ok   { background:#e8f5ee; color:var(--green); border-color:#bfe3cf; }
  .warn { background:#fdf3e3; color:var(--amber); border-color:#ecd9ae; }
  .bad  { background:#fbeae8; color:var(--red); border-color:#eec7c3; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
           gap:12px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; }
  .card h3 { margin:0 0 8px; font-size:11px; text-transform:uppercase;
             letter-spacing:.12em; color:var(--mut); }
  .kv { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .kv b { font-variant-numeric:tabular-nums; font-weight:600; }
  .bar { height:8px; background:#ece8de; border-radius:5px; overflow:hidden; margin-top:6px; }
  .bar i { display:block; height:100%; background:var(--blue); }
  section { background:var(--card); border:1px solid var(--line);
            border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  section h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase;
               letter-spacing:.12em; color:var(--mut); }
  .tblwrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; white-space:nowrap; }
  th { text-align:left; color:var(--mut); font-weight:600; font-size:11px;
       text-transform:uppercase; letter-spacing:.06em; padding:5px 10px 5px 0;
       border-bottom:1px solid var(--line); }
  td { padding:6px 10px 6px 0; border-bottom:1px solid #f0ede5;
       font-variant-numeric:tabular-nums; }
  .pos { color:var(--green); } .neg { color:var(--red); } .mut { color:var(--mut); }
  .act-skip { color:var(--amber); font-weight:600; }
  .act-sell { color:var(--green); font-weight:600; }
  input, button { font:inherit; }
  input[type=number], input[type=text] {
    width:72px; padding:3px 6px; border:1px solid var(--line); border-radius:6px; }
  input.note { width:130px; }
  button { padding:4px 12px; border:1px solid var(--line); border-radius:7px;
           background:#f1eee6; cursor:pointer; }
  button:hover { background:#e8e4d8; }
  pre { background:#14181f; color:#cfd6e1; border-radius:8px; padding:12px;
        overflow-x:auto; font-size:12px; line-height:1.5; margin:0;
        max-height:340px; overflow-y:auto; }
  .msg { font-size:12px; margin-left:8px; }
  .pnl-sub { font-size:11px; color:var(--mut); text-align:right;
             margin:-3px 0 3px; white-space:nowrap;
             font-variant-numeric:tabular-nums; }
  footer { color:var(--mut); font-size:11px; padding:6px 2px 20px; }
</style>
<style>
  .plan h3 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--mut); }
  .plan ul { margin:0; padding-left:18px; } .plan li { margin:3px 0; }
  .plan p { margin:6px 0; }
</style>
</head>
<body>
<script src="/static/lab-nav.js"></script>
<div class="wrap">
  <header><h1 id="title">Sandbox</h1><span class="badge">planned — no engine yet</span></header>
  <section class="plan" id="plan"></section>
  <footer>Each new sandbox follows SANDBOX_PLAYBOOK.md in order: the spec (strategies, schema, gates) is written first,
    then the paper engine and the offline tests, then the test-gated deploy. Nothing is live-traded before its gate.</footer>
</div>
<script>
const PLANS = {
  crypto: { title: "Crypto sandbox", why: "24/7 market: no session, no close, no holidays.",
    changes: ["No end of session, so the mark/roll step becomes a fixed UTC cut (e.g. 00:00 UTC) and the day loop becomes a rolling loop",
              "Data: Schwab has no spot crypto. A new read-only source (exchange public API) behind one exception type, plus a second source as fallback",
              "Fractional sizing (qty to 1e-8). Fees are exchange maker/taker bps, not per-share",
              "Weekend gaps don't exist, but liquidity does thin out. The slippage model needs a time-of-day tier"],
    seeds: ["BTC/ETH trend (price vs 20/100-day MA) — the index-timing canon, moved to crypto",
            "Cross-sectional momentum over the top ~15 coins by volume",
            "Funding-rate regime tag (a §6a split, not an entry rule)"] },
  fx: { title: "FX sandbox", why: "24/5 market: rolls at 17:00 New York, carry is part of P&L.",
    changes: ["Day boundary at 17:00 ET (the FX roll), not 16:00",
              "Risk in pips × pip value. Size in units or lots. Swap/carry is credited or debited on every roll",
              "Data: majors via the estate's Schwab market-data (forex symbols), with a Yahoo fallback (EURUSD=X)",
              "No split heal. Instead: weekend gap handling and holiday-thin sessions"],
    seeds: ["G10 carry basket, filtered by trend (long high-yield vs low-yield only above the 200-day MA)",
            "Time-series momentum on EURUSD / USDJPY / GBPUSD / AUDUSD",
            "Tags: DXY vs its 10-month SMA, rate-differential regime"] },
  commodities: { title: "Commodities sandbox", why: "Futures: contract months, rolls, multipliers, margin.",
    changes: ["Continuous-contract handling: a roll schedule, back-adjusted history, and the roll logged as an event (like the stocks split heal)",
              "Risk = contracts × multiplier × stop distance. Margin replaces the notional cap. Micros (/MCL /MGC) for pilot size",
              "Data: Schwab futures quotes/bars (/CL /GC /NG /ZC …) through the hub grant. ETF proxies (USO, GLD, UNG) as the fallback",
              "Tick grids per contract (e.g. /CL 0.01 = $10). Exchange/NFA fees per contract"],
    seeds: ["Diversified trend following (the managed-futures canon): 50/100-day breakout, ATR stops",
            "Term-structure carry (backwardation vs contango) as a tag first, a strategy only if the splits say so",
            "Gold vs real-rates regime tag"] },
};
const key = location.pathname.replace(/^\/|\/$/g, "");
const p = PLANS[key] || {title: "Sandbox", why: "", changes: [], seeds: []};
document.title = p.title;
document.getElementById("title").textContent = p.title;
const li = xs => "<ul>" + xs.map(x => `<li>${x}</li>`).join("") + "</ul>";
document.getElementById("plan").innerHTML =
  `<p><b>${p.why}</b> The Stocks &amp; ETFs sandbox is the template. About 70% of the design copies across unchanged:
   the journal, the pure rules plus fake-clock tests, the gates, and the dashboard.</p>` +
  `<h3>What changes for this asset class</h3>${li(p.changes)}` +
  `<h3>Strategy seeds (hypotheses, not edge — each gets a pre-registered gate)</h3>${li(p.seeds)}` +
  `<h3>Status</h3><p>Not started. Next step: write the spec (strategies, journal schema, gates) before any code.</p>`;
</script>
</body>
</html>
